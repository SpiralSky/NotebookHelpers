[build-system]
requires = [
    "setuptools>=77",
    "wheel"
]
build-backend = "setuptools.build_meta"


[project]
name = "load-clean"
version = "0.0.3"
description = "Resolve Python definitions and build clean notebooks"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.md"]
requires-python = ">=3.10"

dependencies = []

[project.optional-dependencies]
notebook = ["ipython>=8"]
tools = [
    "jupytext>=1.16",
    "nbformat>=5.10",
    "nbclient>=0.10",
]

dev = ["pytest>=8", "build>=1.2", "ipython>=8", "jupytext>=1.16", "nbformat>=5.10", "nbclient>=0.10", "ipykernel>=6"]

[project.scripts]
load-clean = "load_clean_tools.cli:main"
load-clean-build = "load_clean_tools.cli:main"

[tool.setuptools.packages.find]
where = [
    "src"
]

[dependency-groups]
dev = ["pytest>=8", "build>=1.2", "ipython>=8", "jupytext>=1.16", "nbformat>=5.10", "nbclient>=0.10", "ipykernel>=6"]
