[build-system]
requires = [
    "setuptools>=68",
    "wheel"
]
build-backend = "setuptools.build_meta"


[project]
name = "load-clean"
version = "0.0.1"
description = "Python package"
requires-python = ">=3.10"

dependencies = [
    "ipython",
    "ast-comments",
]


[tool.setuptools.packages.find]
where = [
    "src"
]

[dependency-groups]
dev = [
    "build>=1.5.0",
]
